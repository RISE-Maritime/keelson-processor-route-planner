[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keelson-processor-route-planner"
version = "0.1.0"
description = "Keelson processor that generates, validates and publishes safe voyage-route alternatives as keelson.Route artifacts (voyage planning + validation, NOT collision avoidance)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "RISE Maritime" }]
dependencies = [
    "keelson==0.5.1",
    "eclipse-zenoh>=1.2.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "environs>=11.0",
    # Deferred to later phases (kept out of the base skeleton):
    #   asyncpg / aiohttp   -> chart_adapter (P2)
    #   networkx / scipy / numpy -> pathfinding (P4)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "httpx>=0.27",   # FastAPI TestClient for /health smoke tests
]

[project.scripts]
route_planner = "route_planner.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
