[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keelson-processor-route-planner"
version = "0.1.0"
description = "Keelson processor that generates, validates and publishes safe voyage-route alternatives as keelson.Route artifacts (voyage planning + validation, NOT collision avoidance)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "RISE Maritime" }]
dependencies = [
    # keelson MUST be installed from the monorepo SDK (/Users/ted/Documents/CODE/keelson/sdks/python):
    # the canonical contract is keelson.Route, and the PyPI wheel (0.5.1 / 0.5.2) does NOT ship
    # payloads.Route_pb2 (the generated *_pb2 are gitignored, regenerated only at release). Install
    # it first, then `uv pip install -e ".[dev]"` (see README/CONTRIBUTING).
    "keelson",
    "eclipse-zenoh>=1.2.1",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "environs>=11.0",
    "psycopg[binary,pool]>=3.2",  # chart_adapter: direct PostGIS (P2)
    "httpx>=0.27",                # chart_adapter: chart-server HTTP (P2)
    "numpy>=1.26",                # pathfinding: cost grid + A* (P4)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[project.scripts]
route_planner = "route_planner.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
