# Example runtime config for keelson-processor-route-planner.
#
# All fields are optional. Precedence (lowest to highest): built-in defaults < this file
# (--config) < CLI flags (--realm / --entity-id / --source-id).
# Copy to config/route_planner.yaml and edit, or pass with `--config`.
#
# Deployment URLs come from the environment, NOT this file (see .env.example):
#   CHART_SERVER_URL   chart-server HTTP base (default http://localhost:8080)
#   DATABASE_URL       PostGIS connection for the chart_adapter (P2+)

realm: rise                # keelson realm / base path
entity_id: route-planner   # keelson entity id
source_id: route-planner/0 # keelson source id (also the RPC responder id)
