# Dev variant: build locally and run against an ALREADY-RUNNING local keelson/zenoh router.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# The planner is reached over Keelson RPC through that router (no HTTP port). Uses a bridge
# network + extra_hosts so host.docker.internal resolves on Linux too (harmless on Docker
# Desktop). The router must already be listening on the host at tcp/localhost:7447.
services:
  route-planner:
    build:
      context: .
      # This machine's Docker bridge can't reach PyPI (DNS/MTU, often a VPN); the host network
      # can. Build with host networking so `uv pip install` works.
      network: host
    init: true # Docker's built-in init (signal forwarding + zombie reaping); replaces tini.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CHART_SERVER_URL: ${CHART_SERVER_URL:-http://host.docker.internal:8080}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - ./config:/config:ro
    command: ["--connect", "tcp/host.docker.internal:7447"]
